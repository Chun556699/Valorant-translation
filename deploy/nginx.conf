# VTranslate Nginx 站点配置：放到 /etc/nginx/conf.d/vtranslate.conf，
# 把 api.example.com 换成你的域名；证书可用 certbot --nginx -d api.example.com 自动签发。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vtranslate {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # 统一转发头：X-Forwarded-For 用 $remote_addr 覆盖（不追加），防客户端伪造 IP 绕过限流
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 实时翻译 WebSocket：长连接 + 关闭缓冲，降低字幕延迟
    location /ws/ {
        proxy_pass http://vtranslate;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        tcp_nodelay on;
    }

    # 管理后台：强烈建议限制来源 IP（取消注释并填写你的 IP）
    location /admin {
        # allow 1.2.3.4;
        # deny  all;
        proxy_pass http://vtranslate;
        proxy_set_header Connection "";
    }
    location /api/admin/ {
        # allow 1.2.3.4;
        # deny  all;
        proxy_pass http://vtranslate;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://vtranslate;
        proxy_set_header Connection "";
    }
}
