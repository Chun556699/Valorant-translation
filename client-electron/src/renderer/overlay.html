<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
* { box-sizing: border-box; margin: 0; padding: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
html, body { height: 100%; background: transparent; overflow: hidden; }
:root { --fs: 1; --bgA: .6; }
#wrap { display: flex; flex-direction: column; height: 100vh; border-radius: 12px; overflow: hidden;
  background: rgba(10, 14, 20, var(--bgA)); border: 1px solid rgba(255,255,255,calc(var(--bgA) * .12));
  transition: background .2s; }
#bar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; flex: none;
  background: rgba(0,0,0,.35); user-select: none; cursor: move;
  opacity: 1; transition: opacity .25s; }
body.locked #bar { cursor: default; }
body.through #bar { background: transparent; opacity: .7; }
body.through .bbtn { display: none; }
body.through.barhover #bar { background: rgba(0,0,0,.35); opacity: 1; }
body.through.barhover .bbtn { display: inline-block; }
body.locked #btnLock { color: #ff8090; }
.logo { width: 14px; height: 14px; background: #ff4655; flex: none;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; opacity: .25; background: #6b7a8c; transition: all .15s; }
#mateDot.on { background: #1fd1b2; opacity: 1; box-shadow: 0 0 6px #1fd1b2; }
#pttDot.on { background: #ff4655; opacity: 1; box-shadow: 0 0 8px #ff4655; animation: pulse .5s infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
#status { font-size: 11px; color: #c5cfdb; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bbtn { -webkit-app-region: no-drag; border: 0; background: rgba(255,255,255,.08); color: #dde4ec;
  font-size: 11px; height: 20px; padding: 0 8px; border-radius: 6px; cursor: pointer; }
.bbtn:hover { background: rgba(255,255,255,.2); }
.bbtn.off { color: #7d8a99; text-decoration: line-through; }
#list { flex: 1; overflow-y: auto; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#list > .b:first-child { margin-top: auto; }
#list::-webkit-scrollbar { width: 0; }
.b { padding: 4px 0 6px; border-bottom: 1px solid rgba(255,255,255,.06); transition: opacity 1.2s ease;
  animation: in .18s ease; }
.b:last-child { border-bottom: 0; }
.b.fade { opacity: 0; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.who { display: inline-block; font-size: calc(10.5px * var(--fs)); font-weight: 800; color: #0b1016;
  padding: 0 6px; border-radius: 4px; margin-bottom: 2px; line-height: 1.6; }
.dst { font-size: calc(15px * var(--fs)); font-weight: 700; line-height: 1.4; word-wrap: break-word;
  text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
.src { font-size: calc(12px * var(--fs)); line-height: 1.35; word-wrap: break-word; opacity: .9;
  text-shadow: 0 1px 2px rgba(0,0,0,.9); }
.b.live .dst::after { content: "▍"; color: #ff4655; margin-left: 2px; animation: pulse .6s infinite alternate; }
body.nosrc .src { display: none; }
body.folded #list { display: none; }
body.folded #wrap { height: 30px; }
</style></head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="logo"></div>
    <div class="dot" id="pttDot" title="PTT"></div>
    <div class="dot" id="mateDot" title="Mate"></div>
    <div id="status">就绪</div>
    <button class="bbtn" id="btnMate">队友</button>
    <button class="bbtn" id="btnLock" title="锁定位置">🔓</button>
    <button class="bbtn" id="btnPin">穿透</button>
    <button class="bbtn" id="btnFold">—</button>
    <button class="bbtn" id="btnHide">✕</button>
  </div>
  <div id="list"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
